version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: soc-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: soc-redis-broker
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-fastapi-backend
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: soc_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENV: production
      EMULATOR_MIN_INTERVAL: 0.5
      EMULATOR_MAX_INTERVAL: 2.0
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/workspace/logs
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-react-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
